<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gate Check-In — SLPP NY Executive Inauguration & Grand Ball</title>
<meta property="og:type" content="website">
<meta property="og:title" content="SLPP NY — Gate Check-In (Staff Only)">
<meta property="og:description" content="Executive Inauguration & Grand Ball · Saturday, September 5, 2026 · Antun's, Queens Village, NY.">
<meta property="og:image" content="https://slppnewyorkchapter.github.io/images/checkin-link-preview.jpg">
<meta property="og:url" content="https://slppnewyorkchapter.github.io/checkin.html">
<meta name="twitter:card" content="summary_large_image">
<script src="vendor/jsQR.js"></script>
<style>
  :root{ --navy:#1c2b6b; --gold:#c9971f; --green:#0b4a22; --red:#8a1f1f; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding: 18px 14px 60px 14px;
    background: linear-gradient(180deg,#0b2e1a,#05170d);
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh; color:#fff;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .header { text-align:center; color:#f4e6b8; margin-bottom:14px; }
  .header h1 { font-size:17px; margin:0 0 2px 0; font-weight:700; }
  .header p { margin:0; font-size:12px; opacity:0.8; }

  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab {
    flex:1; text-align:center; padding:10px; border-radius:8px; font-weight:700; font-size:14px;
    background:rgba(255,255,255,0.08); cursor:pointer;
  }
  .tab.active { background: linear-gradient(180deg,#f7e08a,var(--gold) 60%,#8a5a13); color:#1a1a1a; }

  .card { background:#fff; color:#1a1a1a; border-radius:12px; padding:18px; margin-bottom:16px; }

  #scanner-wrap { position:relative; border-radius:10px; overflow:hidden; background:#000; aspect-ratio:1/1; }
  #scanner-wrap video { width:100%; height:100%; object-fit:cover; }
  #scanner-wrap .frame {
    position:absolute; inset: 12%; border: 3px solid var(--gold); border-radius:12px; pointer-events:none;
  }
  .scan-note { font-size:12px; text-align:center; color:#cfe8d8; margin-top:10px; opacity:0.85; }
  .scan-toggle { text-align:center; margin-top:10px; }
  .scan-toggle button {
    background:none; border:1px solid rgba(255,255,255,0.4); color:#fff; padding:8px 16px;
    border-radius:20px; font-size:13px; cursor:pointer;
  }

  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12px; font-weight:700; color:#333; margin-bottom:4px; }
  .field input { width:100%; padding:11px 12px; border-radius:8px; border:1.5px solid #ccc; font-size:15px; }
  .field select { width:100%; padding:11px 12px; border-radius:8px; border:1.5px solid #ccc; font-size:15px; background:#fff; }

  .btn {
    width:100%; padding:13px; border:none; border-radius:8px; font-size:15px; font-weight:800;
    cursor:pointer; margin-top:6px;
  }
  .btn-lookup { background: var(--navy); color:#fff; }
  .btn-checkin { background: linear-gradient(180deg,#1a7a42,var(--green) 60%,#062c14); color:#fff; }
  .btn-undo { background: linear-gradient(180deg,#a13a3a,var(--red) 60%,#4a0f0f); color:#fff; }
  .btn:disabled { opacity:0.6; }

  .result-card { border-radius:10px; padding:16px; margin-top:14px; }
  .result-valid { background:#eafaf0; border:1.5px solid #0b6b33; }
  .result-used  { background:#fdeaea; border:1.5px solid #8a1f1f; }
  .result-error { background:#fdeaea; border:1.5px solid #8a1f1f; }
  .result-name { font-size:19px; font-weight:800; margin-bottom:2px; }
  .result-tier { font-size:14px; color:#444; margin-bottom:10px; }
  .result-msg  { font-size:14px; font-weight:700; }

  .summary { text-align:center; font-size:14px; color:#f4e6b8; margin-bottom:10px; }
  .recent-item {
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,0.06); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px;
  }
  .recent-item .who { font-weight:700; }
  .recent-item .when { opacity:0.7; font-size:11px; }
  .recent-item button {
    background:rgba(255,255,255,0.15); border:none; color:#fff; padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer;
  }
  .refresh-btn {
    display:block; margin: 0 auto 14px auto; background:none; border:1px solid rgba(255,255,255,0.4);
    color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Gate Check-In</h1>
    <p>SLPP NY Executive Inauguration &amp; Grand Ball · Sept 5, 2026</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="scan">Scan Ticket</div>
    <div class="tab" data-tab="door">Door Sale</div>
    <div class="tab" data-tab="recent">Recently Checked In</div>
  </div>

  <div id="tab-scan">
    <div class="card">
      <div id="scanner-wrap">
        <video id="video" playsinline muted></video>
        <div class="frame"></div>
      </div>
      <div class="scan-note">Point the camera at the guest's ticket QR code.</div>
      <div class="scan-toggle"><button id="btnManual">Can't scan? Enter ticket number manually</button></div>

      <div id="manualEntry" style="display:none; margin-top:14px;">
        <div class="field"><label>Serial Number</label><input type="text" id="manualSerial" placeholder="NY-SGP-0007" /></div>
        <button class="btn btn-lookup" id="btnLookup">Look Up Ticket</button>
      </div>

      <div id="resultArea"></div>
    </div>
  </div>

  <div id="tab-door" style="display:none;">
    <div class="card">
      <div id="doorGate">
        <div class="scan-note" style="margin-top:0; margin-bottom:14px; color:#555;">For guests paying at the door with no pre-sold ticket. Enter the staff passphrase to continue.</div>
        <div class="error" id="doorGateError" style="display:none; background:#fdeaea; color:#8a1f1f; border:1px solid #e6b8b8; border-radius:8px; padding:10px 14px; font-size:14px; margin-bottom:14px;"></div>
        <div class="field"><label>Passphrase</label><input type="password" id="doorPw" placeholder="Enter passphrase" /></div>
        <button class="btn btn-lookup" id="btnDoorUnlock">Unlock</button>
      </div>

      <div id="doorForm" style="display:none;">
        <div class="error" id="doorFormError" style="display:none; background:#fdeaea; color:#8a1f1f; border:1px solid #e6b8b8; border-radius:8px; padding:10px 14px; font-size:14px; margin-bottom:14px;"></div>
        <div class="field"><label>Guest Name</label><input type="text" id="doorName" placeholder="Full name" /></div>
        <div class="field"><label>Phone (optional)</label><input type="tel" id="doorPhone" placeholder="(555) 555-5555" /></div>
        <div class="field">
          <label>Ticket Tier</label>
          <select id="doorTier">
            <option value="single">Single — $100</option>
            <option value="single_patron">Single Patron — $200</option>
            <option value="double_patron">Double Patron — $300</option>
          </select>
        </div>
        <div class="field">
          <label>Chapter Affiliation</label>
          <select id="doorChapterSelect">
            <option value="">Select one…</option>
            <option value="host">SLPP North America — New York Chapter (Host)</option>
            <option value="other">Another Sister Chapter</option>
            <option value="none">Not a Chapter Member</option>
          </select>
        </div>
        <div class="field" id="doorChapterOtherWrap" style="display:none;">
          <label>Which Chapter?</label><input type="text" id="doorChapterOther" placeholder="e.g., Atlanta Chapter" />
        </div>
        <button class="btn btn-checkin" id="btnDoorSubmit">Register &amp; Check In</button>
        <div id="doorResultArea"></div>
      </div>
    </div>
  </div>

  <div id="tab-recent" style="display:none;">
    <div class="card">
      <div class="summary" id="recentSummary" style="color:#1a1a1a;">Loading…</div>
      <button class="refresh-btn" id="btnRefresh" style="border-color:#999; color:#1a1a1a;">Refresh</button>
      <div id="recentList"></div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- CONFIG ----
  var API_ENDPOINT = "https://script.google.com/macros/s/AKfycbwKfLaEsF38fmxONK40b9_xkewnBaHpK93u_iZyxn6f6lMTM_o96q6XG1NAAobg_28w/exec";

  var TIER_LABEL = {
    "single": "Single — $100",
    "single_patron": "Single Patron — $200",
    "double_patron": "Double Patron — $300"
  };

  function apiPost(body){
    return fetch(API_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type":"text/plain"},
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); });
  }

  // ---- Tabs ----
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      var which = tab.dataset.tab;
      document.getElementById('tab-scan').style.display = which === 'scan' ? '' : 'none';
      document.getElementById('tab-door').style.display = which === 'door' ? '' : 'none';
      document.getElementById('tab-recent').style.display = which === 'recent' ? '' : 'none';
      if(which === 'recent') loadRecent();
    });
  });

  // ---- Result rendering ----
  function renderResult(html){
    document.getElementById('resultArea').innerHTML = html;
  }

  function showLookupResult(res, serialFallback){
    if(!res.ok){
      renderResult('<div class="result-card result-error"><div class="result-msg">Ticket not found. Please check the number and try again.</div></div>');
      resumeScanning();
      return;
    }
    var tierLabel = TIER_LABEL[res.tier] || res.tier;
    var chapterLine = res.chapter ? ('<div class="result-tier">' + res.chapter + '</div>') : '';
    if(res.status === 'unclaimed'){
      renderResult('<div class="result-card result-error">' +
        '<div class="result-name">Not yet claimed</div>' +
        '<div class="result-tier">' + tierLabel + '</div>' +
        '<div class="result-msg">This voucher hasn\'t been claimed by a guest yet — it cannot be checked in.</div>' +
        '</div>');
      resumeScanning();
      return;
    }
    if(res.status === 'used'){
      renderResult('<div class="result-card result-used">' +
        '<div class="result-name">' + (res.name || 'Guest') + '</div>' +
        '<div class="result-tier">' + tierLabel + '</div>' +
        chapterLine +
        '<div class="result-msg">Already checked in.</div>' +
        '<button class="btn btn-undo" id="btnUndo">Undo Check-In</button>' +
        '</div>');
      document.getElementById('btnUndo').addEventListener('click', function(){
        doUncheckin(serialFallback);
      });
      // Nothing further required from the volunteer to move on to the next
      // guest — Undo remains available, but scanning can safely resume.
      resumeScanning();
      return;
    }
    // status === 'claimed' — valid, not yet checked in.
    // Scanning intentionally stays paused here: this is a deliberate pause
    // for the volunteer to check the name and tap Confirm. Resuming the
    // camera while this card is up is what caused it to keep re-triggering
    // and overwriting this exact screen.
    renderResult('<div class="result-card result-valid">' +
      '<div class="result-name">' + (res.name || 'Guest') + '</div>' +
      '<div class="result-tier">' + tierLabel + '</div>' +
      chapterLine +
      '<button class="btn btn-checkin" id="btnConfirmCheckin">Confirm Check-In</button>' +
      '</div>');
    document.getElementById('btnConfirmCheckin').addEventListener('click', function(){
      this.disabled = true;
      doCheckin(serialFallback);
    });
  }

  var lastScan = { serial: null, token: null };

  function resumeScanning(){ scanning = true; }

  function lookupBySerial(serial, token){
    apiPost({ action:'lookup', s: serial, t: token || '' }).then(function(res){
      showLookupResult(res, serial);
    }).catch(function(){
      renderResult('<div class="result-card result-error"><div class="result-msg">' +
        'Could not reach the ticket system. Check your internet connection and try scanning again, ' +
        'or use manual entry below.</div></div>');
      resumeScanning();
    });
  }

  function doCheckin(serial){
    renderResult('<div class="result-card"><div class="result-msg">Checking in…</div></div>');
    apiPost({ action:'checkin', s: serial, t: lastScan.serial === serial ? lastScan.token : '' }).then(function(res){
      if(res.ok){
        renderResult('<div class="result-card result-valid">' +
          '<div class="result-name">' + (res.name || 'Guest') + '</div>' +
          '<div class="result-tier">' + (TIER_LABEL[res.tier] || res.tier) + '</div>' +
          '<div class="result-msg">✓ Checked in.</div>' +
          '</div>');
        resumeScanning();
      } else if(res.error === 'already_used'){
        showLookupResult({ ok:true, status:'used', name: res.name, tier: res.tier }, serial);
      } else {
        renderResult('<div class="result-card result-error"><div class="result-msg">Could not check in: ' + (res.error||'unknown error') + '</div></div>');
        resumeScanning();
      }
    }).catch(function(){
      renderResult('<div class="result-card result-error"><div class="result-msg">' +
        'Could not reach the ticket system. Check your internet connection and try again.</div></div>');
      resumeScanning();
    });
  }

  function doUncheckin(serial){
    apiPost({ action:'uncheckin', s: serial, t: lastScan.serial === serial ? lastScan.token : '' }).then(function(res){
      if(res.ok){
        renderResult('<div class="result-card"><div class="result-msg">Check-in undone. Guest can be checked in again.</div></div>');
      } else {
        renderResult('<div class="result-card result-error"><div class="result-msg">Could not undo: ' + (res.error||'unknown error') + '</div></div>');
      }
      resumeScanning();
    }).catch(function(){
      renderResult('<div class="result-card result-error"><div class="result-msg">' +
        'Could not reach the ticket system. Check your internet connection and try again.</div></div>');
      resumeScanning();
    });
  }

  // ---- Manual entry ----
  document.getElementById('btnManual').addEventListener('click', function(){
    var el = document.getElementById('manualEntry');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('btnLookup').addEventListener('click', function(){
    var serial = document.getElementById('manualSerial').value.trim();
    if(!serial) return;
    lastScan = { serial: null, token: null }; // manual = no token available
    lookupBySerial(serial, '');
  });

  // ---- Camera scanning ----
  var scanning = true;
  function parseVerifyUrl(text){
    try{
      var u = new URL(text);
      return { serial: u.searchParams.get('s'), token: u.searchParams.get('t') };
    }catch(e){ return null; }
  }

  function startCamera(){
    var video = document.getElementById('video');
    var canvas = document.createElement('canvas');
    // willReadFrequently tells the browser this canvas will have getImageData
    // called on it repeatedly (every frame) — without this hint, some
    // browsers back the canvas with a GPU surface that's slow to read back
    // from on the CPU side, adding real per-frame cost to every scan attempt.
    var ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Cap the resolution actually used for QR detection. A QR code doesn't
    // need full camera resolution to decode reliably, and processing a
    // full 1080p+ frame 60 times a second is real, avoidable CPU cost that
    // shows up as slower detection, especially on older/lower-end Android
    // phones. Requesting a smaller capture size up front (and, as a
    // fallback, downscaling in software below) cuts that cost substantially.
    var SCAN_MAX_DIM = 640;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: SCAN_MAX_DIM }, height: { ideal: SCAN_MAX_DIM } }
    }).then(function(stream){
      video.srcObject = stream;
      video.setAttribute('playsinline', true);
      video.play();
      requestAnimationFrame(tick);
    }).catch(function(err){
      document.querySelector('.scan-note').textContent = 'Camera unavailable — use manual entry below.';
    });

    function tick(){
      if(scanning && video.readyState === video.HAVE_ENOUGH_DATA){
        // Downscale defensively even if the camera ignored our resolution
        // hint above (some devices/browsers do) — never process more
        // pixels than SCAN_MAX_DIM on the longer side.
        var vw = video.videoWidth, vh = video.videoHeight;
        var scale = Math.min(1, SCAN_MAX_DIM / Math.max(vw, vh));
        var cw = Math.round(vw * scale), ch = Math.round(vh * scale);
        if(canvas.width !== cw) canvas.width = cw;
        if(canvas.height !== ch) canvas.height = ch;
        ctx.drawImage(video, 0, 0, cw, ch);
        var imageData = ctx.getImageData(0, 0, cw, ch);
        // Our tickets only ever produce standard black-on-white QR codes —
        // skipping the inverted-color pass jsQR normally also attempts
        // saves real per-frame time for no loss of detection ability here.
        var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
        if(code){
          var parsed = parseVerifyUrl(code.data);
          if(parsed && parsed.serial){
            scanning = false;
            lastScan = parsed;
            renderResult('<div class="result-card"><div class="result-msg">Ticket found — checking status…</div></div>');
            lookupBySerial(parsed.serial, parsed.token);
            // Scanning resumes only when the current ticket's flow actually
            // finishes (see resumeScanning() calls below) — not on a fixed
            // timer. A blind timer can fire before a slow lookup returns,
            // or while the QR is still in frame waiting on a human decision,
            // which caused the camera to re-trigger and overwrite whatever
            // was on screen (the "oscillating" bug).
          }
        }
      }
      requestAnimationFrame(tick);
    }
  }
  startCamera();

  // ---- Recently checked in ----
  function loadRecent(){
    document.getElementById('recentSummary').textContent = 'Loading…';
    apiPost({ action:'recent', limit: 20 }).then(function(res){
      if(!res.ok){
        document.getElementById('recentSummary').textContent = 'Could not load.';
        return;
      }
      document.getElementById('recentSummary').textContent = res.recent.length + ' checked in (most recent shown)';
      var list = document.getElementById('recentList');
      list.innerHTML = '';
      res.recent.forEach(function(r){
        var time = new Date(r.checkedInAt).toLocaleTimeString();
        var div = document.createElement('div');
        div.className = 'recent-item';
        div.innerHTML = '<div><div class="who">' + (r.name||'Guest') + '</div>' +
          '<div class="when">' + (TIER_LABEL[r.tier]||r.tier) + ' · ' + time +
          (r.chapter ? (' · ' + r.chapter) : '') + '</div></div>';
        var btn = document.createElement('button');
        btn.textContent = 'Undo';
        btn.addEventListener('click', function(){
          apiPost({ action:'uncheckin', s: r.serial, t:'' }).then(function(){ loadRecent(); })
            .catch(function(){ alert('Could not undo — check your internet connection and try again.'); });
        });
        div.appendChild(btn);
        list.appendChild(div);
      });
    }).catch(function(){
      document.getElementById('recentSummary').textContent = 'Could not reach the ticket system — check your internet connection.';
    });
  }
  document.getElementById('btnRefresh').addEventListener('click', loadRecent);

  // ---- Door Sale (walk-up guests with no pre-sold voucher) ----
  var doorPassword = null;

  document.getElementById('btnDoorUnlock').addEventListener('click', function(){
    var pw = document.getElementById('doorPw').value;
    var errEl = document.getElementById('doorGateError');
    errEl.style.display = 'none';
    if(!pw){
      errEl.textContent = 'Please enter the passphrase.';
      errEl.style.display = 'block';
      return;
    }
    doorPassword = pw; // verified server-side on first real submit
    document.getElementById('doorGate').style.display = 'none';
    document.getElementById('doorForm').style.display = 'block';
  });

  document.getElementById('doorChapterSelect').addEventListener('change', function(){
    document.getElementById('doorChapterOtherWrap').style.display = (this.value === 'other') ? 'block' : 'none';
  });

  document.getElementById('btnDoorSubmit').addEventListener('click', function(){
    var name = document.getElementById('doorName').value.trim();
    var phone = document.getElementById('doorPhone').value.trim();
    var tier = document.getElementById('doorTier').value;
    var chapterSelect = document.getElementById('doorChapterSelect').value;
    var chapterOther = document.getElementById('doorChapterOther').value.trim();
    var errEl = document.getElementById('doorFormError');
    errEl.style.display = 'none';

    if(!name){
      errEl.textContent = 'Please enter the guest\'s name.';
      errEl.style.display = 'block';
      return;
    }
    if(!chapterSelect){
      errEl.textContent = 'Please select the guest\'s chapter affiliation.';
      errEl.style.display = 'block';
      return;
    }
    if(chapterSelect === 'other' && !chapterOther){
      errEl.textContent = 'Please enter which chapter the guest belongs to.';
      errEl.style.display = 'block';
      return;
    }

    var chapter = chapterSelect === 'host' ? 'SLPP North America — New York Chapter (Host)'
                : chapterSelect === 'none' ? 'Not a Chapter Member'
                : chapterOther;

    var btn = document.getElementById('btnDoorSubmit');
    btn.disabled = true;
    btn.textContent = 'Registering…';

    apiPost({ action:'door_sale', password: doorPassword, name: name, phone: phone, tier: tier, chapter: chapter })
      .then(function(res){
        btn.disabled = false;
        btn.textContent = 'Register & Check In';

        if(!res.ok){
          if(res.error === 'wrong_password'){
            document.getElementById('doorForm').style.display = 'none';
            document.getElementById('doorGate').style.display = 'block';
            document.getElementById('doorGateError').textContent = 'Incorrect passphrase.';
            document.getElementById('doorGateError').style.display = 'block';
            return;
          }
          errEl.textContent = 'Could not register guest: ' + (res.error || 'unknown error');
          errEl.style.display = 'block';
          return;
        }

        document.getElementById('doorResultArea').innerHTML =
          '<div class="result-card result-valid">' +
          '<div class="result-name">' + res.name + '</div>' +
          '<div class="result-tier">' + (TIER_LABEL[res.tier] || res.tier) + ' · ' + res.serial + '</div>' +
          '<div class="result-tier">' + (res.chapter || '') + '</div>' +
          '<div class="result-msg">✓ Registered and checked in.</div>' +
          '</div>';

        // Clear the form for the next walk-up guest
        document.getElementById('doorName').value = '';
        document.getElementById('doorPhone').value = '';
        document.getElementById('doorChapterSelect').value = '';
        document.getElementById('doorChapterOther').value = '';
        document.getElementById('doorChapterOtherWrap').style.display = 'none';
      })
      .catch(function(){
        btn.disabled = false;
        btn.textContent = 'Register & Check In';
        errEl.textContent = 'Network error — please check your connection and try again.';
        errEl.style.display = 'block';
      });
  });

})();
</script>
</body>
</html>
