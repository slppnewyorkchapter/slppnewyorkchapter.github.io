<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vouchers — SLPP NY Executive Inauguration & Grand Ball</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="SLPP NY — My Vouchers">
<meta property="og:description" content="Executive Inauguration & Grand Ball · Saturday, September 5, 2026 · Antun's, Queens Village, NY.">
<meta property="og:image" content="https://slppnewyorkchapter.github.io/images/checkin-link-preview.jpg">
<meta property="og:url" content="https://slppnewyorkchapter.github.io/myvouchers.html">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{ --navy:#1c2b6b; --gold:#c9971f; --green:#0b4a22; --red:#8a1f1f; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding: 24px 16px 60px 16px;
    background: linear-gradient(180deg,#0b2e1a,#05170d);
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh; color:#fff;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .header { text-align:center; color:#f4e6b8; margin-bottom:18px; }
  .header h1 { font-size:18px; margin:0 0 2px 0; font-weight:700; }
  .header p { margin:0; font-size:12px; opacity:0.8; }

  .summary-card {
    background:#fff; color:#1a1a1a; border-radius:12px; padding:18px; margin-bottom:16px;
    display:flex; justify-content:space-around; text-align:center;
  }
  .summary-card .num { font-size:22px; font-weight:900; }
  .summary-card .lbl { font-size:11px; font-weight:700; color:#666; text-transform:uppercase; letter-spacing:0.5px; }
  .summary-unclaimed .num { color:#888; }
  .summary-claimed .num { color:#0b6b33; }
  .summary-used .num { color:#1c2b6b; }

  .voucher-row {
    background:#fff; color:#1a1a1a; border-radius:10px; padding:14px; margin-bottom:10px;
  }
  .vr-top { display:flex; justify-content:space-between; align-items:center; }
  .vr-serial { font-weight:800; font-size:14px; }
  .vr-status {
    font-size:11px; font-weight:800; padding:3px 10px; border-radius:12px; text-transform:uppercase;
  }
  .vr-status-unclaimed { background:#eee; color:#666; }
  .vr-status-claimed { background:#eafaf0; color:#0b6b33; }
  .vr-status-used { background:#e8eefb; color:#1c2b6b; }
  .vr-detail { font-size:13px; color:#444; margin-top:8px; }
  .vr-note { font-size:12px; color:#999; margin-top:8px; font-style:italic; }

  .btn-release {
    margin-top:10px; border:none; padding:9px 16px; font-size:13px; font-weight:800; border-radius:8px;
    background: linear-gradient(180deg,#a83a3a,var(--red) 60%,#4a0f0f); color:#fff; cursor:pointer;
  }

  .reason-box { margin-top:10px; display:none; }
  .reason-box textarea {
    width:100%; padding:10px; border-radius:8px; border:1.5px solid #ccc; font-size:13px; font-family:inherit;
    resize:vertical; min-height:56px;
  }
  .reason-box .reason-actions { display:flex; gap:8px; margin-top:8px; }
  .reason-box button {
    border:none; padding:9px 14px; font-size:13px; font-weight:700; border-radius:8px; cursor:pointer;
  }
  .btn-confirm-release { background:var(--red); color:#fff; }
  .btn-cancel-release { background:#eee; color:#333; }

  #state-msg { color:#fff; text-align:center; padding: 60px 20px; font-size:16px; max-width:480px; margin:0 auto; }
  #state-msg a { color:#f4e6b8; }
  .spinner-msg { color:#cfe8d8; text-align:center; padding: 60px 20px; font-size:15px; }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; font-weight:700; color:#333; margin-bottom:5px; }
  .field input {
    width:100%; padding:12px 14px; border-radius:8px; border:1.5px solid #ccc; font-size:15px;
  }
  .btn-primary {
    width:100%; padding:14px; border:none; border-radius:8px; font-size:16px; font-weight:800;
    background: linear-gradient(180deg,#f7e08a,var(--gold) 60%,#8a5a13); color:#1a1a1a; cursor:pointer;
  }
  .card { background:#fff; color:#1a1a1a; border-radius:12px; padding:22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>My Vouchers</h1>
    <p>SLPP NY Executive Inauguration &amp; Grand Ball · Saturday, September 5, 2026</p>
  </div>
  <div id="root"></div>
</div>

<script>
(function(){
  var API_ENDPOINT = "https://script.google.com/macros/s/AKfycbwKfLaEsF38fmxONK40b9_xkewnBaHpK93u_iZyxn6f6lMTM_o96q6XG1NAAobg_28w/exec";

  var TIER_LABEL = {
    "single": "Single — $100",
    "single_patron": "Single Patron — $200",
    "double_patron": "Double Patron — $300"
  };

  var WHY_NOT_MESSAGES = {
    "too_old": "Too much time has passed since this was claimed to release it yourself — contact the chapter directly if this buyer truly never paid.",
    "too_close_to_event": "Self-service release is closed this close to the event — contact the chapter directly.",
    "already_checked_in": "This guest has already checked in at the door.",
    "not_claimed": "This voucher hasn't been claimed yet — nothing to release.",
    "unknown_claim_time": "Contact the chapter directly to release this one."
  };

  function qs(name){
    var u = new URL(window.location.href);
    return u.searchParams.get(name);
  }

  function apiPost(body){
    return fetch(API_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type":"text/plain"},
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); });
  }

  var seller = qs('seller');
  var token = qs('token');

  function showMessage(html){
    document.getElementById('root').innerHTML = '<div id="state-msg">' + html + '</div>';
  }

  if(!seller || !token){
    showMessage('This link is missing information needed to load your dashboard. Please use the exact link ' +
      'that was sent to you, or contact the chapter at <a href="tel:+18182726589">(818) 272-6589</a>.');
    return;
  }

  function load(){
    document.getElementById('root').innerHTML = '<div class="spinner-msg">Loading your vouchers…</div>';
    apiPost({ action:'list_my_vouchers', seller: seller, token: token })
      .then(function(res){
        if(!res.ok){
          showMessage('We couldn\'t load your dashboard. Please double check your link, or contact the chapter at ' +
            '<a href="tel:+18182726589">(818) 272-6589</a>.');
          return;
        }
        render(res);
      })
      .catch(function(){
        showMessage('Something went wrong loading your vouchers. Please try again in a moment.');
      });
  }

  function render(res){
    var root = document.getElementById('root');
    var vouchers = res.vouchers || [];

    var counts = { unclaimed: 0, claimed: 0, used: 0 };
    vouchers.forEach(function(v){ counts[v.status] = (counts[v.status] || 0) + 1; });

    var html = '<div class="summary-card">' +
      '<div class="summary-unclaimed"><div class="num">' + counts.unclaimed + '</div><div class="lbl">Unclaimed</div></div>' +
      '<div class="summary-claimed"><div class="num">' + counts.claimed + '</div><div class="lbl">Claimed</div></div>' +
      '<div class="summary-used"><div class="num">' + counts.used + '</div><div class="lbl">Checked In</div></div>' +
      '</div>';

    if(vouchers.length === 0){
      html += '<div class="card">No vouchers found for ' + seller + ' yet.</div>';
    } else {
      vouchers.sort(function(a,b){ return a.serial < b.serial ? -1 : 1; });
      vouchers.forEach(function(v){
        html += '<div class="voucher-row" data-serial="' + v.serial + '">' +
          '<div class="vr-top">' +
            '<span class="vr-serial">' + v.serial + '</span>' +
            '<span class="vr-status vr-status-' + v.status + '">' + v.status + '</span>' +
          '</div>' +
          '<div class="vr-detail">' + (TIER_LABEL[v.tier] || v.tier) + '</div>';

        if(v.status === 'claimed' || v.status === 'used'){
          html += '<div class="vr-detail">' + (v.name || 'Guest') + (v.phone ? (' · ' + v.phone) : '') + '</div>';
        }

        if(v.status === 'unclaimed' && v.link){
          var message = "Hello! Here's your ticket to the SLPP North America New York Chapter " +
            "Executive Inauguration & Grand Ball — " + (TIER_LABEL[v.tier] || v.tier) + ".\n" +
            "Saturday, September 5, 2026 \u00b7 Doors open 8:00 PM \u00b7 Antun's, Queens Village, NY.\n" +
            "Your ticket: " + v.link + "\n" +
            "Tap the link, enter your name to claim it, then save the ticket to your phone.";
          var waHref = "https://wa.me/?text=" + encodeURIComponent(message);
          html += '<div class="lr-actions" style="display:flex; gap:8px; margin-top:10px;">' +
            '<a class="btn-wa" href="' + waHref + '" target="_blank" rel="noopener" ' +
              'style="flex:1; text-align:center; background:#25D366; color:#fff; text-decoration:none; ' +
              'padding:9px 0; border-radius:6px; font-size:13px; font-weight:700;">\u{1F4F1} Send via WhatsApp</a>' +
            '<button class="btn-copy-voucher" data-link="' + v.link + '" ' +
              'style="flex:0 0 auto; border:none; background:var(--navy); color:#fff; padding:9px 14px; ' +
              'border-radius:6px; font-size:13px; font-weight:700; cursor:pointer;">Copy Link</button>' +
            '</div>';
        }

        if(v.status === 'claimed' && v.canRelease){
          html += '<button class="btn-release" data-action="show-reason">Release (Not Paid)</button>' +
            '<div class="reason-box">' +
              '<textarea placeholder="Why are you releasing this? (e.g. no payment received)"></textarea>' +
              '<div class="reason-actions">' +
                '<button class="btn-confirm-release">Confirm Release</button>' +
                '<button class="btn-cancel-release">Cancel</button>' +
              '</div>' +
            '</div>';
        } else if(v.status === 'claimed' && !v.canRelease){
          html += '<div class="vr-note">' + (WHY_NOT_MESSAGES[v.whyNot] || 'This one can\'t be self-released — contact the chapter.') + '</div>';
        }

        html += '</div>';
      });
    }

    root.innerHTML = html;
    wireReleaseButtons();
    wireCopyButtons();
  }

  function wireCopyButtons(){
    document.querySelectorAll('.btn-copy-voucher').forEach(function(btn){
      btn.addEventListener('click', function(){
        navigator.clipboard.writeText(btn.getAttribute('data-link'));
        btn.textContent = 'Copied';
        setTimeout(function(){ btn.textContent = 'Copy Link'; }, 1200);
      });
    });
  }

  function wireReleaseButtons(){
    document.querySelectorAll('.voucher-row').forEach(function(row){
      var serial = row.dataset.serial;
      var showBtn = row.querySelector('[data-action="show-reason"]');
      var box = row.querySelector('.reason-box');
      if(!showBtn) return;

      showBtn.addEventListener('click', function(){
        showBtn.style.display = 'none';
        box.style.display = 'block';
      });

      row.querySelector('.btn-cancel-release').addEventListener('click', function(){
        box.style.display = 'none';
        showBtn.style.display = 'block';
      });

      row.querySelector('.btn-confirm-release').addEventListener('click', function(){
        var reason = row.querySelector('textarea').value.trim();
        if(!reason){
          alert('Please enter a reason before releasing.');
          return;
        }
        var btn = row.querySelector('.btn-confirm-release');
        btn.disabled = true;
        btn.textContent = 'Releasing…';

        apiPost({ action:'release_claim', seller: seller, token: token, serial: serial, reason: reason })
          .then(function(res){
            if(res.ok){
              load(); // refresh the whole list so counts/status stay accurate
            } else {
              alert('Could not release this voucher: ' + (WHY_NOT_MESSAGES[res.error] || res.error || 'unknown error'));
              btn.disabled = false;
              btn.textContent = 'Confirm Release';
            }
          })
          .catch(function(){
            alert('Network error — please try again.');
            btn.disabled = false;
            btn.textContent = 'Confirm Release';
          });
      });
    });
  }

  load();
})();
</script>
</body>
</html>
